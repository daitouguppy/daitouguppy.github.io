<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大頭仔 & 魚你有約｜孔雀魚室</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#001d2a;color:#fff;font-family:Arial,"Noto Sans TC",sans-serif}
header{position:sticky;top:0;z-index:20;background:#003b52;padding:14px 16px;text-align:center;box-shadow:0 2px 12px #0008}
header h1{font-size:21px;margin:0 0 4px}
header p{font-size:13px;color:#9bd9e8;margin:0}
.cartBtn{position:absolute;right:12px;top:13px;border:0;border-radius:25px;background:#ffd43b;color:#182000;font-weight:bold;padding:10px 14px}
.badge{background:#e53935;color:#fff;border-radius:50%;padding:2px 7px;margin-left:3px}
h2{text-align:center;margin:25px 0 18px;font-size:20px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding:0 14px 30px;max-width:1100px;margin:auto}
.card{background:#00405a;border:1px solid #16708e;border-radius:16px;overflow:hidden;box-shadow:0 4px 14px #0007}
.videoBox{background:#000;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;overflow:hidden}
.videoBox video{width:100%;height:100%;object-fit:cover;object-position:center;background:#000;display:block}
.info{padding:12px 14px 15px}
.name{font-size:16px;font-weight:bold;margin-bottom:7px}
.sub{font-size:12px;color:#b7e1ea;margin-bottom:8px}
.price{font-size:22px;color:#ffd43b;font-weight:bold;margin:5px 0 10px}
.desc{font-size:12px;color:#c8e5eb;margin-bottom:9px}
.stock{font-weight:bold;color:#65e6aa;font-size:13px;margin-bottom:9px}
.qty{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.qty button{width:34px;height:34px;border:0;border-radius:8px;background:#087ab3;color:#fff;font-size:22px}
.qty span{min-width:20px;text-align:center;font-weight:bold}
.qty small{color:#a7c4cc}
.btn{width:100%;border:0;border-radius:9px;padding:11px;margin-top:7px;font-weight:bold;color:#fff;font-size:14px}
.add{background:#00b96b}.buy{background:#ffb400;color:#172000}.line{background:#00b86b}.phone{background:#0875b2}
button:disabled{opacity:.45}
.overlay{display:none;position:fixed;inset:0;background:#0009;z-index:50;align-items:flex-end}
.modal{background:#f7fbfc;color:#17313a;width:100%;max-height:92vh;border-radius:22px 22px 0 0;padding:20px;overflow:auto}
.modal h3{margin:0 0 14px}
.close{float:right;border:0;background:#ddd;border-radius:50%;width:32px;height:32px}
.cartItem{border-bottom:1px solid #d5e0e3;padding:10px 0}
.cartRow{display:flex;justify-content:space-between;gap:12px}
.total{font-size:20px;font-weight:bold;margin:16px 0}
.form input,.form select,.form textarea{width:100%;padding:11px;margin:6px 0 9px;border:1px solid #b9cdd2;border-radius:8px;font-size:15px}
.form label{font-size:13px;font-weight:bold}
.checkout{background:#08a86a;color:white;border:0;border-radius:10px;padding:13px;width:100%;font-weight:bold;font-size:16px}
.empty{text-align:center;color:#56717a;padding:20px}
@media(max-width:700px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:0 12px 25px}.info{padding:10px}.name{font-size:14px}.price{font-size:19px}.btn{font-size:12px;padding:10px 5px}.cartBtn{font-size:12px;padding:9px 10px}header h1{font-size:19px}}
@media(max-width:430px){.grid{gap:9px;padding:0 9px}.name{font-size:13px}.sub,.desc,.stock{font-size:11px}.qty{gap:7px}.qty button{width:31px;height:31px}.qty small{font-size:10px}}
</style>
</head>
<body>
<header>
<button class="cartBtn" onclick="openCart()">🛒 購物車 <span class="badge" id="cartCount">0</span></button>
<h1>🐟 大頭仔 & 魚你有約</h1>
<p>孔雀魚室｜精品種魚・實拍影片</p>
</header>

<h2>🔥 種魚商品</h2>
<main class="grid" id="products"></main>

<div class="overlay" id="overlay" onclick="if(event.target===this)closeCart()">
<div class="modal">
<button class="close" onclick="closeCart()">✕</button>
<h3>🛒 我的購物車</h3>
<div id="cartItems"></div>
<div class="total" id="cartSummary">
<div>🧾 商品小計：<span id="cartSubtotal">NT$0</span></div>
<div style="margin-top:8px">🛵 運費：<span id="shippingFee">NT$0</span></div>
<div style="margin-top:10px;font-size:22px">💰 應付總額：<span id="grandTotal">NT$0</span></div>
</div>
<div class="form">
<label>姓名</label><input id="customerName" placeholder="請輸入姓名">
<label>電話</label><input id="customerPhone" type="tel" placeholder="請輸入手機或電話">
<label>取貨方式</label>
<select id="delivery" onchange="renderCart()"><option>面交</option><option>宅配</option><option>超商取貨（請先確認是否可配送）</option></select>
<label>地址／店名</label><input id="address" placeholder="宅配請填地址；超商請填店名">
<label>備註</label><textarea id="note" rows="3" placeholder="例如：希望週末取貨、魚隻偏好等"></textarea>
<button class="checkout" onclick="submitOrder()">📩 送出訂單並用 LINE 聯絡</button>
</div>
</div>
</div>

<script src="products.js"></script>
<script>
let cart=JSON.parse(localStorage.getItem('guppyCart')||'{}');
const LINE_ID=''; // 如有 LINE 官方帳號網址，可在這裡填入
const phone='';   // 如要顯示固定電話，可在這裡填入

function money(n){return 'NT$'+n.toLocaleString()}
function save(){localStorage.setItem('guppyCart',JSON.stringify(cart));updateCount()}
function updateCount(){document.getElementById('cartCount').textContent=Object.values(cart).reduce((a,b)=>a+b,0)}
function setQty(id,d){
 const p=PRODUCTS.find(x=>String(x.id)===String(id)); if(!p)return;
 cart[id]=Math.max(0,Math.min(p.stock,(cart[id]||0)+d)); if(!cart[id])delete cart[id]; save(); render(); if(document.getElementById('overlay').style.display==='flex') renderCart();
}
function add(id){
 if((cart[id]||0)>=PRODUCTS.find(p=>p.id==id).stock)return;
 cart[id]=(cart[id]||0)+1;save();render();
}
function buy(id){cart[id]=Math.min(PRODUCTS.find(p=>p.id==id).stock,1);save();openCart()}
function render(){
 const box=document.getElementById('products');
 box.innerHTML=PRODUCTS.map(p=>{
  const q=cart[p.id]||0;
  return `<article class="card">
   <div class="videoBox"><video controls playsinline preload="metadata" src="${p.video}"></video></div>
   <div class="info">
    <div class="name">🐟 ${p.name}</div><div class="sub">${p.subtitle}</div>
    <div class="price">${money(p.price)}</div><div class="desc">${p.desc}</div>
    <div class="stock">📦 庫存：${p.stock} 組</div>
    <div class="qty"><button onclick="setQty(${p.id},-1)">−</button><span>${q}</span><button onclick="setQty(${p.id},1)">＋</button><small>購物車數量</small></div>
    <button class="btn add" onclick="add(${p.id})" ${q>=p.stock?'disabled':''}>🛒 加入購物車</button>
    <button class="btn buy" onclick="buy(${p.id})">🛍️ 立即購買</button>
    <button class="btn line" onclick="askLine(${p.id})">💬 LINE 詢問 #${p.id} ${p.name}</button>
    <button class="btn phone" onclick="askPhone()">📞 電話詢問</button>
   </div></article>`
 }).join('');
 updateCount();
}
function openCart(){renderCart();document.getElementById('overlay').style.display='flex'}
function closeCart(){document.getElementById('overlay').style.display='none'}
function getShippingFee(){
 const qty=Object.values(cart).reduce((a,b)=>a+b,0);
 const delivery=document.getElementById('delivery')?.value||'面交';
 if(delivery==='面交') return 0;
 if(qty<=0) return 0;
 if(qty===1) return 150;
 return 200;
}
function renderCart(){
 const el=document.getElementById('cartItems');let subtotal=0;
 const rows=Object.entries(cart).map(([id,q])=>{
  const p=PRODUCTS.find(x=>String(x.id)===String(id));if(!p)return '';
  subtotal+=p.price*q;
  return `<div class="cartItem"><div class="cartRow"><b>${p.name}</b><span>${money(p.price*q)}</span></div>
  <div style="font-size:13px;margin-top:5px">數量：${q}　<button onclick="setQty(${id},-1);renderCart()">➖</button> <button onclick="setQty(${id},1);renderCart()">➕</button></div></div>`;
 }).join('');
 el.innerHTML=rows||'<div class="empty">購物車目前是空的</div>';
 const shipping=getShippingFee();
 const grandTotal=subtotal+shipping;
 document.getElementById('cartSubtotal').textContent=money(subtotal);
 document.getElementById('shippingFee').textContent=money(shipping);
 document.getElementById('grandTotal').textContent=money(grandTotal);
}
function orderText(){
 let total=0,lines=['🐟 大頭仔 & 魚你有約｜孔雀魚室','📦 新訂單'];
 Object.entries(cart).forEach(([id,q])=>{
  const p=PRODUCTS.find(x=>String(x.id)===String(id));if(!p)return;
  total+=p.price*q;lines.push(`${p.name} × ${q} = ${money(p.price*q)}`);
 });
 const shipping=getShippingFee();
 lines.push(`🧾 商品小計：${money(total)}`);
 lines.push(`🛵 運費：${money(shipping)}`);
 lines.push(`💰 應付總額：${money(total+shipping)}`);
 lines.push(`👤 姓名：${document.getElementById('customerName').value}`);
 lines.push(`📞 電話：${document.getElementById('customerPhone').value}`);
 lines.push(`🚚 取貨：${document.getElementById('delivery').value}`);
 lines.push(`📍 地址／店名：${document.getElementById('address').value}`);
 lines.push(`📝 備註：${document.getElementById('note').value}`);
 return lines.join('\\n');
}
function submitOrder(){
 if(!Object.keys(cart).length)return alert('購物車目前沒有商品！');
 if(!document.getElementById('customerName').value.trim()||!document.getElementById('customerPhone').value.trim())return alert('請先填寫姓名與電話！');
 const text=orderText();
 navigator.clipboard?.writeText(text);
 if(LINE_ID) window.open(LINE_ID,'_blank');
 else alert('訂單內容已整理並嘗試複製到剪貼簿，請貼到你的 LINE 與店家聯絡。\\n\\n'+text);
}
function askLine(id){
 const p=PRODUCTS.find(x=>x.id==id);
 const text=`您好，我想詢問 ${p.name}，價格 ${money(p.price)}，請問目前還有嗎？`;
 navigator.clipboard?.writeText(text);
 if(LINE_ID)window.open(LINE_ID,'_blank');else alert('詢問內容已複製：\\n'+text);
}
function askPhone(){if(phone)location.href='tel:'+phone;else alert('請在 index.html 的 phone 變數填入電話號碼。')}
render();
</script>
</body>
</html>
