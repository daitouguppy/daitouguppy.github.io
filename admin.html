<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>商品管理｜大頭仔 & 魚你有約</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#071522;color:#eef7ff;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}.wrap{max-width:1100px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.btn{border:1px solid #31596b;background:#0d2837;color:#fff;padding:9px 13px;border-radius:10px;cursor:pointer}.primary{background:#70dced;color:#04202b;border:0;font-weight:900}.note{color:#9bb7c2;font-size:14px;line-height:1.7}.list{display:grid;gap:14px;margin-top:20px}.item{background:#0a1d2a;border:1px solid #214858;border-radius:16px;padding:16px}.itemGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.item input,.item textarea{width:100%;padding:10px;border-radius:9px;border:1px solid #315667;background:#061721;color:#fff}.item textarea{min-height:70px;resize:vertical}.full{grid-column:1/-1}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.danger{border-color:#7b3d48;background:#341820}.json{margin-top:20px}.json textarea{width:100%;min-height:150px;background:#04111a;color:#cdeef7;border:1px solid #284b5b;border-radius:10px;padding:12px;font-family:monospace}
@media(max-width:700px){.itemGrid{grid-template-columns:1fr}}
</style></head>
<body><div class="wrap">
<div class="top"><div><h1>🛠 商品管理</h1><div class="note">管理新增、修改、複製、刪除、排序、價格、庫存、影片檔名與商品說明。</div></div><div><button class="btn" onclick="location.href='index.html'">回網站</button></div></div>
<div class="actions" style="margin-top:18px"><button class="btn primary" onclick="addProduct()">＋ 新增商品</button><button class="btn" onclick="downloadJS()">下載 products.js</button><button class="btn" onclick="backup()">備份 JSON</button><button class="btn" onclick="document.getElementById('restoreFile').click()">還原 JSON</button><input id="restoreFile" type="file" accept=".json" hidden onchange="restore(this)"></div>
<div id="list" class="list"></div>
<div class="json"><h2>目前資料 JSON</h2><textarea id="json"></textarea></div>
</div>
<script>
let data=[
{id:1,name:"#1 自改良極血紅大背緞帶",price:1200,stock:5,video:"LINE_MOVIE_1790313978285_web.mp4",subtitle:"粗體原線公｜實拍影片①",desc:"1公、1緞母、1短母"},
{id:2,name:"#2 自改良極血紅大背緞帶",price:900,stock:5,video:"LINE_MOVIE_1790313997010_web.mp4",subtitle:"粗體原線公｜實拍影片②",desc:"1公、1緞母、1短母"},
{id:3,name:"#3 自改良極血紅大背緞帶",price:900,stock:5,video:"LINE_MOVIE_1790314006514_web.mp4",subtitle:"粗體原線公｜實拍影片③",desc:"1公、1緞母、1短母"},
{id:4,name:"#4 自改良極血紅大背緞帶",price:900,stock:5,video:"LINE_MOVIE_1790314029057_web.mp4",subtitle:"粗體原線公｜實拍影片④",desc:"1公、1緞母、1短母"}];
function sync(){document.getElementById("json").value=JSON.stringify(data,null,2)}
function render(){document.getElementById("list").innerHTML=data.map((p,i)=>`<div class="item"><h2>${i+1}. ${p.name}</h2><div class="itemGrid">
<label>商品名稱<input value="${esc(p.name)}" oninput="edit(${p.id},'name',this.value)"></label>
<label>價格<input type="number" value="${p.price}" oninput="edit(${p.id},'price',this.value)"></label>
<label>庫存<input type="number" value="${p.stock}" oninput="edit(${p.id},'stock',this.value)"></label>
<label>影片檔名<input value="${esc(p.video)}" oninput="edit(${p.id},'video',this.value)"></label>
<label>副標題<input value="${esc(p.subtitle)}" oninput="edit(${p.id},'subtitle',this.value)"></label>
<label class="full">商品說明<textarea oninput="edit(${p.id},'desc',this.value)">${esc(p.desc)}</textarea></label></div>
<div class="actions"><button class="btn" onclick="move(${i},-1)">↑ 上移</button><button class="btn" onclick="move(${i},1)">↓ 下移</button><button class="btn" onclick="duplicate(${i})">複製</button><button class="btn danger" onclick="removeP(${p.id})">刪除</button></div></div>`).join("");sync()}
function esc(s){return String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;")}
function edit(id,k,v){const p=data.find(x=>x.id===id);if(!p)return;p[k]=(k==="price"||k==="stock")?Number(v):v;sync()}
function addProduct(){const id=data.length?Math.max(...data.map(x=>x.id))+1:1;data.push({id,name:"新商品",price:0,stock:0,video:"",subtitle:"",desc:""});render()}
function duplicate(i){const p={...data[i],id:Math.max(...data.map(x=>x.id))+1,name:data[i].name+"（複製）"};data.splice(i+1,0,p);render()}
function removeP(id){if(confirm("確定刪除這個商品？")){data=data.filter(x=>x.id!==id);render()}}
function move(i,d){const j=i+d;if(j<0||j>=data.length)return;[data[i],data[j]]=[data[j],data[i]];render()}
function downloadJS(){const s="const PRODUCTS = "+JSON.stringify(data,null,2)+";\\n";const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([s],{type:"text/javascript"}));a.download="products.js";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function backup(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));a.download="products-backup.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function restore(input){const f=input.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!Array.isArray(x))throw Error();data=x;render();alert("還原完成");}catch(e){alert("JSON 格式不正確")}};r.readAsText(f)}
render();
</script></body></html>
